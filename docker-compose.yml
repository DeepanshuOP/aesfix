# ==============================================================================
# AesFix Production Service Orchestration (docker-compose)
#
# Why this composition is structured this way:
# 1. aesfix-gateway: Runs the central FastAPI pipeline, Tier-A engine, and MCP server.
# 2. redis: Backs the asynchronous SSE event queue and rate-limiting counters.
# 3. prometheus: Periodically scrapes hardware COGS & inference latency from /metrics.
# ==============================================================================

services:
  aesfix-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aesfix-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_ENABLED=true
    volumes:
      - aesfix-data:/app/results
      - aesfix-cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aesfix-net

  redis:
    image: redis:7-alpine
    container_name: aesfix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aesfix-net

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: aesfix-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      - aesfix-gateway
    networks:
      - aesfix-net

volumes:
  aesfix-data:
    driver: local
  aesfix-cache:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  aesfix-net:
    driver: bridge
